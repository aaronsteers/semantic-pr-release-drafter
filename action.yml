name: 'Semantic PR Release Drafter'
description: 'Drafts your next release notes based on semantic commit messages from merged pull requests.'
runs:
  using: 'node24'
  main: 'dist/index.js'
branding:
  icon: edit-2
  color: orange
inputs:
  config-name:
    description: |
      If your workflow requires multiple release-drafter configs it be helpful to override the config-name.
      The config should still be located inside `.github` as that's where we are looking for config files.
      In GitHub Actions, config files are loaded from the running ref (`GITHUB_REF_NAME`).
    required: false
    default: 'release-drafter.yml'
  name:
    description: |
      The name that will be used in the GitHub release that's created or updated.
      This will override any `name-template` specified in your `release-drafter.yml` if defined.
    required: false
  tag:
    description: |
      The tag name to be associated with the GitHub release that's created or updated.
      This will override any `tag-template` specified in your `release-drafter.yml` if defined.
    required: false
  version:
    description: |
      The version to be associated with the GitHub release that's created or updated.
      This will override any version calculated by the release-drafter.
      Accepts inputs with or without the 'v' prefix ("1.2.3" or "v1.2.3", normalized internally).
    required: false
  publish:
    description: |
      A boolean indicating whether the release being created or updated should be immediately published.
    required: false
    default: ''
  latest:
    description: |
      A string indicating whether the release being created or updated should be marked as latest.
    required: false
    default: ''
  prerelease:
    description: |
      A boolean indicating whether the release being created or updated is a prerelease.
    required: false
    default: ''
  prerelease-identifier:
    description: |
      A string indicating an identifier (alpha, beta, rc, etc), to increment the prerelease version.
    required: false
    default: ''
  commitish:
    description: |
      The object that the release should be created to point to.
    required: false
    default: ''
  header:
    description: |
      A string that would be added before the template body.
    required: false
    default: ''
  footer:
    description: |
      A string that would be added after the template body.
    required: false
    default: ''
  name-template:
    description: |
      The template for the release name. Supports placeholders like $RESOLVED_VERSION.
      This will override any `name-template` specified in your config file.
    required: false
    default: ''
  tag-template:
    description: |
      The template for the release tag. Supports placeholders like $RESOLVED_VERSION.
      This will override any `tag-template` specified in your config file.
    required: false
    default: ''
  change-template:
    description: |
      The template for each changelog entry. Supports placeholders like $TITLE, $URL, $SHA, $NUMBER, $AUTHOR, $SCOPE.
      $SCOPE is rendered using scope-template when a scope is present, or an empty string when absent.
      This will override any `change-template` specified in your config file.
    required: false
    default: ''
  scope-template:
    description: |
      The template for rendering the $SCOPE placeholder in change-template. Only rendered when a scope is present.
      Inside this template, $SCOPE is the raw lowercase scope value (e.g., "registry", "cli, mcp").
      Multi-scopes are normalized with spaces (e.g., "cli,mcp" becomes "cli, mcp").
      When no scope is present, the entire scope-template is skipped and $SCOPE in change-template resolves to "".
      Default is '' (disabled). Examples: '$SCOPE: ', '[$SCOPE] ', '$SCOPE/ '.
    required: false
    default: ''
  template:
    description: |
      The template for the release body. Supports placeholders like $CHANGES, $OWNER, $REPOSITORY, etc.
      This will override any `template` specified in your config file.
    required: false
    default: ''
  categories:
    description: |
      A YAML string defining the categories for grouping changes.
      Example:
        categories: |
          - title: 'Features'
            commit-types:
              - 'feat'
          - title: 'Bug Fixes'
            commit-types:
              - 'fix'
      This will override any `categories` specified in your config file.
    required: false
    default: ''
  category-template:
    description: |
      The template for category headers. Supports placeholders like $TITLE.
      This will override any `category-template` specified in your config file.
    required: false
    default: ''
  local-git-root:
    description: |
      Path to a local git repository root. When set, the action will use `git log`
      to fetch commits instead of the GitHub API. This is useful for integration testing.
      Note: Commit filtering is ancestry-based. When a base-ref-override is provided, the action
      uses git ancestry (for example, `git log BASE_REF..HEAD`) to find commits after that ref.
    required: false
    default: ''
  base-ref-override:
    description: |
      A git ref (tag, branch, or commit SHA) to use as the starting point for finding commits.
      When set along with local-git-root, the action will get commits that are descendants of this ref
      using git ancestry (for example, `git log BASE_REF..HEAD`).
      This also serves as the base version for calculating the next semver if base-version-override is not set.
      Format: git ref (e.g., "v1.0.0", "main", or a commit SHA).
    required: false
    default: ''
  base-version-override:
    description: |
      Override the base version to use for calculating the next version.
      When set, the action will skip querying the GitHub API for the last release
      and use this version as the starting point. Accepts inputs with or without the 'v' prefix ("1.0.0" or "v1.0.0", normalized internally).
      If base-ref is also provided, this takes precedence for version calculation.
    required: false
    default: ''
  dry-run:
    description: |
      A boolean indicating whether to run in dry-run mode.
      In dry-run mode, the action will calculate the release info and set outputs,
      but will not create or update any releases.
    required: false
    default: 'false'
  allow-major-bumps:
    description: |
      A boolean indicating whether to allow automatic major version bumps.
      When false, breaking changes will only bump the minor version, following
      "marketing-aware" semver semantics. When true, breaking changes will
      trigger a major version bump according to standard semver rules. When left
      unset, the behavior defers to the repo config's
      `version-resolver.no-auto-major`, which itself defaults to the
      marketing-aware (minor-only) behavior.
      Note: Pre-1.0 versions always bump minor for breaking changes regardless of this setting.
    required: false
  attach-files:
    description: |
      Files to attach to the draft release as assets. Accepts a single file path,
      a single glob pattern, or multiple file paths/globs as a newline-separated list.
      Supports standard glob patterns and brace expansion (e.g., dist/*.{whl,tar.gz}).
      Paths are resolved relative to GITHUB_WORKSPACE.

      When set, the action will:
      1. Delete ALL existing assets on the draft release (unless reset-files is false)
      2. Upload all matched files as release assets

      If the pattern matches zero files, the action will fail with an error.
      Requires GITHUB_TOKEN with contents: write permission.
    required: false
    default: ''
  prepared-release-id:
    description: |
      The numeric ID of an already-prepared release to finalize, as emitted by
      the `id` output of a previous (`not-ready`) invocation.

      When set, the action fetches that release directly by ID (a strongly
      consistent point-read) and updates it in place, bypassing list-based
      draft discovery. This is the durable way to finalize a draft created by
      an earlier step: it is immune to the eventual consistency of the
      list-releases endpoint, which can otherwise cause a just-created draft to
      be missed and a duplicate release to be created. (The list endpoint is
      still consulted to compute the previous release for the changelog.)

      The prepared release is the source of truth: its version, tag, prerelease
      state, and pinned target commit are reused as-is rather than recomputed,
      so the finalize can't drift if another release is published between the
      steps. Because of this, inputs that would recompute or re-select those
      values are ignored (a no-op) when set alongside `prepared-release-id`, and
      the action emits a warning naming them: `version`, `tag`, `commitish`,
      `base-ref-override`, `base-version-override`, `prerelease`,
      `prerelease-identifier`, and `allow-major-bumps`. (The `filter-by-commitish`
      config option is likewise ignored on this path.)

      Recommended for the two-step (not-ready -> finalize) pattern: capture
      `id` from the first invocation and pass it here on the finalize call —
      that is all you need; the release carries everything else.
    required: false
    default: ''
  reset-files:
    description: |
      Controls whether existing release assets are deleted before uploading new ones.
        - 'true': Delete all existing release assets (even if attach-files is not set).
        - 'false': Keep all existing release assets.
        - 'auto': Automatically delete existing assets if attach-files is provided,
          otherwise keep them.
    required: false
    default: 'auto'
  not-ready:
    description: |
      When truthy, prepends a visible "NOT READY" banner to the release body,
      signaling to administrators that the draft should not be published yet.
      Accepts 'true' for a default warning message, or a custom string that
      will be shown as the banner message.
      Set to 'false' (or omit) to remove the banner.

      Usage patterns:

        A. Third-party asset attacher (e.g. GoReleaser):
          1. Run with `not-ready: true` to create/update the draft with a WIP banner.
          2. (Attach assets via third-party action.)
          3. Run without `not-ready` to regenerate the draft (banner removed).

        B. Release-drafter-managed uploads:
          1. Run with `not-ready: true` to create the draft with a WIP banner.
          2. (Build assets via custom steps.)
          3. Run with `attach-files` (without `not-ready`) to attach assets and finalize.
    required: false
    default: ''
outputs:
  id:
    description: The ID of the release that was created or updated.
  name:
    description: The name of the release
  tag-name:
    description: The name of the tag associated with the release.
  body:
    description: The body of the drafted release.
  html-url:
    description: The URL users can navigate to in order to view the release
  upload-url:
    description: The URL for uploading assets to the release, which could be used by GitHub Actions for additional uses, for example the @actions/upload-release-asset GitHub Action.
  major-version:
    description: The next major version number, with 'v' prefix removed (if applicable).
  minor-version:
    description: The next minor version number, with 'v' prefix removed (if applicable).
  patch-version:
    description: The next patch version number, with 'v' prefix removed (if applicable).
  resolved-version:
    description: The next resolved version number, based on semantic commit types, with 'v' prefix removed (if applicable).
  resolved-sha:
    description: |
      The exact commit SHA this run evaluated and pinned the release to — a
      fixed, point-in-time reference to the target branch's tip at run time.

      Set by default on every pass (dry-run/calculate, create draft, and
      finalize), so downstream build, packaging, and inspection steps can check
      out this exact commit and stay in lockstep with the release even if the
      branch moves afterwards. The resolved SHA is, in priority order: the SHA
      frozen by an earlier pass (on a `prepared-release-id` finalize), an explicit
      `commitish` when it is itself a SHA, or `GITHUB_SHA` (the triggering
      commit) on the default path.

      The only exceptions — where the release deliberately keeps its branch ref
      instead — are when you explicitly override the ref with a branch
      `commitish`, when `filter-by-commitish` is enabled (that feature matches
      releases by branch name, so a SHA would break it), or in local-git mode.
      The `filter-by-commitish` exception does not apply on a `prepared-release-id`
      finalize: that release is targeted by a deterministic point-read, so
      commitish-based selection is moot and the pin is still applied. Outputs
      are only emitted when running in GitHub Actions.
